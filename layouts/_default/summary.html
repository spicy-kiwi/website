<div class="recipe recipe-summary">
    {{/* Merken-Button steht außerhalb des Links: Buttons in Links sind ungültiges HTML */}}
    <div class="favourite">
        <button type="button" data-rid="{{ .Params.recipeName }}" class="btn btn-sm btn-primary btnFavourite" title="Auf die Merkliste setzen" aria-label="{{ .Title }} auf die Merkliste setzen" aria-pressed="false">🖤</button>
    </div>
    <a href="{{ .RelPermalink }}" class="link black dim" title="{{ (i18n "showRecipeFor") }} {{ .Title }}">
        <div class="image">
            <img title="{{ (i18n "showRecipeFor") }} {{ .Title }}"
                 {{- $img := partial "func/CardImage.html" . -}}src="{{ $img.url }}" width="{{ $img.width }}" height="{{ $img.height }}"
                 alt="{{ .Title }}"
                 loading="lazy" decoding="async"
                 class="featured-image">
            <div class="footer">
                <small>
                    {{ partial "recipe-badges.html" (dict "page" . "cooked" false) }}
                </small>
            </div>
        </div>
        <div class="text">
            <h2>
                {{ .Title }}
            </h2>
            <p>

                {{ .Description }}
            </p>
            <p>
                <span class="read-more">{{ $.Param "read_more_copy" | default (i18n "showRecipe") }}</span>
            </p>

        </div>
    </a>
</div>
