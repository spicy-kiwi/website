<p>Quiche kommt aus Frankreich: ein knuspriger Mürbeteig, gefüllt mit Gemüse und einer Mischung aus Eiern und Sahne. Sie schmeckt warm und kalt.</p>
<p>Wir machen sie gerne mit <a href="/rezepte/quiche_mangold/">Mangold</a>, <a href="/rezepte/quiche_pak_choi/">Pak Choi</a> oder <a href="/rezepte/quiche_lauch_champignon/">Champignons</a>.</p>
