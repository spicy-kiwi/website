<p>Bei diesen Rezepten macht der Ofen die meiste Arbeit. Kurz vorbereiten, reinschieben, und in der Zwischenzeit hast du die Hände frei.</p>
<p>Hier findest du Aufläufe und Lasagne, Quiches, <a href="/rezepte/ofengemuese/">Ofengemüse</a>, aber auch Kuchen wie den <a href="/rezepte/rüblikuchen/">Rüblikuchen</a> oder das <a href="/rezepte/bananenbrot/">Bananenbrot</a>.</p>
