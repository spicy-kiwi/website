<p>Suppen wärmen, machen satt und lassen sich gut vorkochen. Die meisten schmecken am zweiten Tag sogar besser.</p>
<p>Unsere Klassiker sind die <a href="/rezepte/pürierte_linsensuppe/">Pürierte Linsensuppe</a>, die <a href="/rezepte/kürbissuppe/">Kürbissuppe</a> und die <a href="/rezepte/minestrone/">Minestrone</a>. Für den Sommer gibt es kalte <a href="/rezepte/gazpacho/">Gazpacho</a>.</p>
