<p>Ein Gericht, eine Pfanne. Alles wird nacheinander angebraten und am Ende zusammen gemischt. Das geht schnell und macht wenig Abwasch.</p>
<p>Zum Beispiel die <a href="/rezepte/gnocchi_pfanne/">Gnocchi-Pfanne</a>, die <a href="/rezepte/maultaschen_pfanne/">Maultaschen-Pfanne</a> oder <a href="/rezepte/gebratener_reis/">Gebratener Reis</a>.</p>
