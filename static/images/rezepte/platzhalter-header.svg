<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="900" viewBox="0 0 2100 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f1e4"/>
      <stop offset="100%" stop-color="#ece4cf"/>
    </linearGradient>
  </defs>
  <rect width="2100" height="900" fill="url(#bg)"/>

  <!-- Kiwi/Chili-Motiv horizontal zentriert (bg-top im CSS beschneidet nur
       vertikal auf breiten Screens, aber horizontal auf schmalen/hohen
       Screens - zentriert bleibt es in beiden Fällen sichtbar), nah am
       oberen Rand platziert, damit es Titel/Beschreibung (vertikal weiter
       unten im Header) nicht überlagert. Dezente Deckkraft als Unfall-
       Absicherung, falls doch mal Text darüber liegt. Kein "Foto folgt"-
       Text hier - der Seitentitel steht ohnehin schon vor diesem Bild. -->
  <g opacity="0.55" transform="translate(1050,280) scale(1.4)">
    <g transform="translate(-33,2)">
      <circle r="46" fill="#8fae4a"/>
      <circle r="38" fill="#b9d27a"/>
      <circle r="14" fill="#f4ecd2"/>
      <g fill="#3f4a1e">
        <ellipse cx="0" cy="-24" rx="2.6" ry="5"/>
        <ellipse cx="17" cy="-17" rx="2.6" ry="5" transform="rotate(45 17 -17)"/>
        <ellipse cx="24" cy="0" rx="2.6" ry="5" transform="rotate(90 24 0)"/>
        <ellipse cx="17" cy="17" rx="2.6" ry="5" transform="rotate(135 17 17)"/>
        <ellipse cx="0" cy="24" rx="2.6" ry="5" transform="rotate(180 0 24)"/>
        <ellipse cx="-17" cy="17" rx="2.6" ry="5" transform="rotate(225 -17 17)"/>
        <ellipse cx="-24" cy="0" rx="2.6" ry="5" transform="rotate(270 -24 0)"/>
        <ellipse cx="-17" cy="-17" rx="2.6" ry="5" transform="rotate(315 -17 -17)"/>
      </g>
    </g>

    <g transform="translate(33,-2) rotate(18)">
      <path d="M -10 -34 C 4 -40 10 -30 4 -20 C 24 -16 34 4 26 26 C 18 46 -8 50 -22 34 C -36 18 -30 -8 -10 -20 Z"
            fill="#c1440e"/>
      <path d="M -10 -34 C 4 -40 10 -30 4 -20" fill="none" stroke="#8f3313" stroke-width="3" stroke-linecap="round"/>
      <path d="M -6 -33 C 2 -44 12 -42 14 -34 C 15 -29 10 -25 6 -27" fill="#5c7a38"/>
    </g>
  </g>
</svg>
