{{ define "main" }}
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy {{ $.Param "text_color" | default "mid-gray" }}">
        {{- .Content -}}
    </section>

    <div class="mw9 center ph3">
        <div class="tag-filter-bar">
            <div class="tag-filter-head">
                <strong>{{ len .Pages }} Zutaten</strong>
            </div>
        </div>
    </div>

    <div class="mw9 center ph3">
        <section class="mt3" id="recipeGrid">
            {{ range .Pages }}
                <div class="recipe-filter-item">
                    {{ .Render "summary" }}
                </div>
            {{ end }}
        </section>
    </div>
{{ end }}
